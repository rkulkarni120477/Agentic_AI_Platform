services:
  platform-api:
    build:
      context: ./services/platform
    environment:
      DATABASE_URL: sqlite:////app/data/platform.db
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - platform-data:/app/data

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_PLATFORM_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - platform-api

volumes:
  platform-data:
